<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
  <title id="title">Agent Mission Control — from a goal to checked work</title>
  <desc id="desc">Illustration, not a recorded run. The lead chooses direct work, one specialist, or parallel independent jobs, then integrates and verifies.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#5BE0E5" stroke-width="1.5"/></marker></defs>
  <rect width="640" height="500" rx="16" fill="#11264B"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <path d="M36 29h17v17H36z" fill="none" stroke="#5BE0E5" stroke-width="2"/>
    <path d="m41 37 4 4 13-13" fill="none" stroke="#5BE0E5" stroke-width="2"/>
    <text x="72" y="45" font-size="19" letter-spacing="3" fill="#A8BBD4">AGENT MISSION CONTROL</text>
    <text x="34" y="122" font-size="55" font-weight="700" letter-spacing="-1" fill="#F4F8FD">A goal in.</text>
    <text x="34" y="185" font-size="55" font-weight="700" letter-spacing="-1" fill="#F4F8FD">Checked work out.</text>
    <text x="36" y="230" font-size="26" fill="#A8BBD4">One lead. The right help. Visible proof.</text>
    <g fill="none" stroke="#5BE0E5" stroke-width="2" marker-end="url(#arrow)">
      <path d="M138 357h16q12 0 12-12v-29q0-12 12-12h22"/>
      <path d="M138 357h16q12 0 12 12v29q0 12 12 12h22"/>
      <path d="M402 304h18q12 0 12 12v29q0 12 12 12h22"/>
      <path d="M402 410h18q12 0 12-12v-29q0-12 12-12h22"/>
    </g>
    <rect x="32" y="319" width="106" height="76" rx="38" fill="#2C568C" stroke="#5BE0E5"/>
    <text x="85" y="367" text-anchor="middle" font-size="28" font-weight="600" fill="#F4F8FD">Lead</text>
    <rect x="207" y="270" width="194" height="68" rx="12" fill="#11264B" stroke="#A8BBD4"/>
    <text x="304" y="313" text-anchor="middle" font-size="27" fill="#F4F8FD">Direct work</text>
    <text x="304" y="364" text-anchor="middle" font-size="18" fill="#A8BBD4">OR</text>
    <rect x="207" y="376" width="194" height="68" rx="12" fill="#11264B" stroke="#A8BBD4"/>
    <text x="304" y="412" text-anchor="middle" font-size="22" fill="#F4F8FD">Specialist</text>
    <text x="304" y="434" text-anchor="middle" font-size="16" fill="#A8BBD4">or parallel</text>
    <rect x="473" y="311" width="139" height="92" rx="12" fill="#11264B" stroke="#FFC46B" stroke-width="2"/>
    <text x="542" y="350" text-anchor="middle" font-size="26" fill="#F4F8FD">Integrate</text>
    <text x="542" y="384" text-anchor="middle" font-size="26" fill="#FFC46B">&amp; verify</text>
    <text x="320" y="479" text-anchor="middle" font-size="17" letter-spacing="1" fill="#A8BBD4">ILLUSTRATIVE ROUTES · CHOSEN FOR THE TASK</text>
  </g>
</svg>
