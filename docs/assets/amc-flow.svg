<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1600" role="img" aria-labelledby="title description">
<title id="title">Agent Mission Control mission map</title>
<desc id="description">One lead routes a coding task through direct work, a bounded specialist or independent isolated jobs. Scout and resume are conditional. Delegation sends a bounded packet. AVO-inspired measured optimization requires a frozen evaluator and baseline. The lead integrates and checks the current artifact. Failures and review findings return to the lead for repair. Costly retries prompt a resource checkpoint. Material risk adds independent review. The lead reports a qualified verdict. Reusable learning is separate after the task.</desc>
