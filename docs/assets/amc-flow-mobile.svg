<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 2100" role="img" aria-labelledby="title description">
<title id="title">Agent Mission Control mission map, mobile</title>
<desc id="description">One lead accepts a coding task, chooses direct work, a specialist or independent parallel jobs, integrates and checks the current artifact. Scout and resume are conditional. Delegated jobs use exact inputs, owned scope and declared checks. AVO-inspired measured optimization needs a frozen evaluator and baseline. Failed checks and review findings return to the lead. Costly retries need a resource checkpoint. Material risk triggers independent review. The lead reports the verdict. Optional learning happens after the task.</desc>
<defs>
