<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 890" role="img" aria-labelledby="title desc">
  <title id="title">Agent Mission Control: one lead, a useful route, checked work</title>
  <desc id="desc">A coding task goes to one lead. The lead chooses direct work, one scoped specialist, or independent parallel help. The lead integrates and checks the current artifact, then reports evidence and limits. Scout, measured optimization, independent review and resume are conditional additions. PASS is advisory.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23324a" stroke-width="1" opacity=".42"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#90abc5" stroke-width="2"/></marker>
  </defs>
  <rect width="1440" height="890" rx="24" fill="#0b1424"/>
  <rect width="1440" height="890" rx="24" fill="url(#grid)"/>
  <path d="M54 173H1386" stroke="#344960" stroke-width="2"/>
  <path d="M54 173H432" stroke="#70d5e9" stroke-width="3"/>
  <text x="54" y="59" fill="#8adcf0" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">AGENT MISSION CONTROL / EXECUTION POLICY</text>
  <text x="54" y="111" fill="#f2f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">One task. One lead. Evidence at the end.</text>
  <text x="55" y="151" fill="#b7c8dc" font-family="Segoe UI,Arial,sans-serif" font-size="23">The task decides how much help to add. The lead remains accountable.</text>

  <text x="54" y="211" fill="#98acc3" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">MAIN PATH</text>
  <path d="M254 370H274M539 370H559M929 370H949" fill="none" stroke="#90abc5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="54" y="232" width="200" height="278" rx="16" fill="#17263a" stroke="#566d86" stroke-width="2"/>
  <text x="78" y="275" fill="#a6bad0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">01 / INPUT</text>
  <text x="78" y="327" fill="#f4f7fc" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Coding task</text>
  <path d="M78 348H225" stroke="#415873" stroke-width="2"/>
  <text x="78" y="387" fill="#c5d2e1" font-family="Segoe UI,Arial,sans-serif" font-size="21">Goal</text>
  <text x="78" y="423" fill="#c5d2e1" font-family="Segoe UI,Arial,sans-serif" font-size="21">Limits</text>
  <text x="78" y="459" fill="#c5d2e1" font-family="Segoe UI,Arial,sans-serif" font-size="21">Done when</text>

  <rect x="284" y="232" width="255" height="278" rx="16" fill="#20243d" stroke="#a391e7" stroke-width="2"/>
  <text x="310" y="275" fill="#c1b5fb" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">02 / LEAD</text>
  <text x="310" y="326" fill="#f4f7fc" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Pick the route</text>
  <path d="M310 348H510" stroke="#585478" stroke-width="2"/>
  <text x="310" y="389" fill="#d1d7e9" font-family="Segoe UI,Arial,sans-serif" font-size="22">Smallest useful</text>
  <text x="310" y="424" fill="#d1d7e9" font-family="Segoe UI,Arial,sans-serif" font-size="22">graph for this task.</text>
  <text x="310" y="476" fill="#a9b5d2" font-family="Segoe UI,Arial,sans-serif" font-size="18">Changes route if evidence does.</text>

  <rect x="569" y="232" width="360" height="278" rx="16" fill="#152a37" stroke="#65bfd3" stroke-width="2"/>
  <text x="595" y="275" fill="#8cd9e9" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">03 / EXECUTION</text>
  <rect x="592" y="291" width="314" height="60" rx="9" fill="#1b3a47"/>
  <rect x="592" y="359" width="314" height="60" rx="9" fill="#263247"/>
  <rect x="592" y="427" width="314" height="60" rx="9" fill="#33313b"/>
  <text x="610" y="328" fill="#f2f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Direct <tspan fill="#a6c5cf" font-size="18" font-weight="400">/ known work</tspan></text>
  <text x="610" y="396" fill="#f2f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Specialist <tspan fill="#bbc0d8" font-size="18" font-weight="400">/ focused gap</tspan></text>
  <text x="610" y="464" fill="#f2f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Parallel <tspan fill="#d6c4ac" font-size="18" font-weight="400">/ independent jobs</tspan></text>

  <rect x="959" y="232" width="427" height="278" rx="16" fill="#182b35" stroke="#8ac9d8" stroke-width="2"/>
  <text x="985" y="275" fill="#a4deea" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">04 / LEAD INTEGRATES + CHECKS</text>
  <text x="985" y="328" fill="#f4f7fc" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Inspect the current artifact.</text>
  <path d="M985 349H1358" stroke="#476674" stroke-width="2"/>
  <text x="985" y="390" fill="#c9dce4" font-family="Segoe UI,Arial,sans-serif" font-size="23">Run relevant checks.</text>
  <text x="985" y="431" fill="#c9dce4" font-family="Segoe UI,Arial,sans-serif" font-size="23">Repair failures; rerun checks.</text>
  <text x="985" y="476" fill="#a7bdc7" font-family="Segoe UI,Arial,sans-serif" font-size="18">A worker saying “done” is not proof.</text>
  <path d="M1172 510V537" fill="none" stroke="#90abc5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="54" y="550" width="1332" height="112" rx="16" fill="#242a38" stroke="#d6b780" stroke-width="2"/>
  <text x="80" y="593" fill="#f0ca89" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">05 / REPORT</text>
  <text x="330" y="596" fill="#f4f7fc" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">PASS · FAIL · NOT VERIFIED · BLOCKED</text>
  <text x="330" y="635" fill="#c4cddd" font-family="Segoe UI,Arial,sans-serif" font-size="20">Observed checks + remaining limits. PASS is advisory.</text>

  <text x="54" y="709" fill="#98acc3" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">ADD ONLY WHEN TRIGGERED · THESE ARE NOT REQUIRED PHASES</text>
  <rect x="54" y="730" width="310" height="112" rx="13" fill="#192638" stroke="#4f6884" stroke-width="2"/>
  <rect x="385" y="730" width="310" height="112" rx="13" fill="#23243b" stroke="#8e80cf" stroke-width="2"/>
  <rect x="716" y="730" width="310" height="112" rx="13" fill="#2a2933" stroke="#c9a56f" stroke-width="2"/>
  <rect x="1047" y="730" width="339" height="112" rx="13" fill="#192b33" stroke="#69b4c1" stroke-width="2"/>
  <text x="78" y="773" fill="#d7e3f3" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Scout</text>
  <text x="78" y="809" fill="#acbfd4" font-family="Segoe UI,Arial,sans-serif" font-size="19">Route or scope unclear</text>
  <text x="409" y="773" fill="#ded6ff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">AVO loop</text>
  <text x="409" y="809" fill="#bcb9da" font-family="Segoe UI,Arial,sans-serif" font-size="19">Measurable candidate</text>
  <text x="740" y="773" fill="#ffe0ad" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Independent review</text>
  <text x="740" y="809" fill="#d1c2ad" font-family="Segoe UI,Arial,sans-serif" font-size="19">Material risk or uncertainty</text>
  <text x="1071" y="773" fill="#d5f3ef" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Resume</text>
  <text x="1071" y="809" fill="#afcdd0" font-family="Segoe UI,Arial,sans-serif" font-size="19">Reconcile saved state + files</text>
</svg>
