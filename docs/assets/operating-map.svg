<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1190" role="img" aria-labelledby="title desc">
  <title id="title">Agent Mission Control decision map</title>
  <desc id="desc">One lead receives a goal, selects direct work, a scoped specialist, or independent parallel jobs, integrates the artifact, checks it, optionally uses a frozen evaluator for measurable candidate improvement, requires independent review for risky work, and reports evidence and limits. An interrupted run reconciles saved state with current files.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#26354b" stroke-width="1" opacity=".35"/></pattern>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8f83e9"/><stop offset=".53" stop-color="#81d3ee"/><stop offset="1" stop-color="#efbd70"/></linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 9 5.5 1 10" fill="none" stroke="#a9bcd1" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1440" height="1190" rx="26" fill="#0d1624"/>
  <rect width="1440" height="1190" rx="26" fill="url(#grid)"/>
  <path d="M57 133H1383" stroke="url(#rail)" stroke-width="3"/>
  <text x="58" y="71" fill="#eef4fb" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="700">One lead. An adaptive execution map.</text>
  <text x="59" y="108" fill="#a7bad0" font-family="Segoe UI,Arial,sans-serif" font-size="21">Each extra step needs a reason. The current artifact and checks decide the result.</text>

  <rect x="58" y="171" width="367" height="128" rx="14" fill="#18253a" stroke="#50627e" stroke-width="2"/>
  <text x="82" y="208" fill="#a6bad3" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">INPUT</text>
  <text x="82" y="249" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Coding task</text>
  <text x="82" y="279" fill="#b9c9da" font-family="Segoe UI,Arial,sans-serif" font-size="19">Goal · constraints · done when</text>
  <path d="M425 235H489" fill="none" stroke="#9db5d1" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="497" y="171" width="886" height="128" rx="14" fill="#202641" stroke="#9589df" stroke-width="2"/>
  <circle cx="535" cy="210" r="13" fill="#9689ea"/>
  <text x="565" y="215" fill="#c5bbff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">LEAD DECIDES</text>
  <text x="524" y="257" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">What is the smallest route that can finish and prove this task?</text>
  <text x="524" y="282" fill="#bdcbe0" font-family="Segoe UI,Arial,sans-serif" font-size="18">If scope or dependencies are unclear, ask one bounded scout; the lead still chooses.</text>

  <path d="M940 299V330M252 330H1188M252 330V356M720 330V356M1188 330V356" fill="none" stroke="#768dab" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="58" y="366" width="397" height="146" rx="14" fill="#172636" stroke="#6bbedc" stroke-width="2"/>
  <text x="83" y="407" fill="#90d9ee" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">DEFAULT · DIRECT</text>
  <text x="83" y="450" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Lead does the work</text>
  <text x="83" y="484" fill="#b9c9da" font-family="Segoe UI,Arial,sans-serif" font-size="19">For known, sequential changes.</text>

  <rect x="522" y="366" width="397" height="146" rx="14" fill="#21243b" stroke="#9d8def" stroke-width="2"/>
  <text x="547" y="407" fill="#b5a7ff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">WHEN FOCUS HELPS</text>
  <text x="547" y="450" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Scoped specialist</text>
  <text x="547" y="484" fill="#b9c9da" font-family="Segoe UI,Arial,sans-serif" font-size="19">Inputs, write scope, acceptance.</text>

  <rect x="986" y="366" width="397" height="146" rx="14" fill="#1d2936" stroke="#c9a775" stroke-width="2"/>
  <text x="1011" y="407" fill="#efd0a0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">WHEN JOBS ARE INDEPENDENT</text>
  <text x="1011" y="450" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Parallel help</text>
  <text x="1011" y="484" fill="#b9c9da" font-family="Segoe UI,Arial,sans-serif" font-size="19">Isolate writers; then fan in.</text>

  <path d="M256 512V545M720 512V545M1184 512V545M256 545H1184M720 545V569" fill="none" stroke="#768dab" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="290" y="580" width="860" height="133" rx="16" fill="#1c2b39" stroke="#85c5dc" stroke-width="2.5"/>
  <text x="322" y="622" fill="#9edcf0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">LEAD INTEGRATES + CHECKS</text>
  <text x="322" y="666" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Inspect the current artifact. Run relevant checks.</text>
  <text x="322" y="694" fill="#b9c9da" font-family="Segoe UI,Arial,sans-serif" font-size="19">Failed check → repair + rerun. A worker's “done” is not proof.</text>

  <path d="M720 713V752M371 752H1069M371 752V769M1069 752V769" fill="none" stroke="#768dab" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="58" y="780" width="626" height="199" rx="16" fill="#21243b" stroke="#9d8def" stroke-width="2"/>
  <text x="86" y="824" fill="#b5a7ff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">ONLY FOR MEASURABLE IMPROVEMENT</text>
  <text x="86" y="871" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">AVO-style candidate loop</text>
  <text x="86" y="911" fill="#cad4e6" font-family="Segoe UI,Arial,sans-serif" font-size="20">Freeze evaluator → baseline → one change → score</text>
  <text x="86" y="944" fill="#cad4e6" font-family="Segoe UI,Arial,sans-serif" font-size="20">Keep a verified gain; otherwise repair or retain.</text>

  <rect x="755" y="780" width="628" height="199" rx="16" fill="#2a2931" stroke="#d6ae74" stroke-width="2"/>
  <text x="783" y="824" fill="#efd0a0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">REQUIRED FOR RELEASE / MIGRATION / DATA LOSS</text>
  <text x="783" y="871" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Independent review</text>
  <text x="783" y="911" fill="#d8d2cc" font-family="Segoe UI,Arial,sans-serif" font-size="20">Review this artifact, not an earlier draft.</text>
  <text x="783" y="944" fill="#d8d2cc" font-family="Segoe UI,Arial,sans-serif" font-size="20">Confirmed findings → repair → recheck.</text>

  <path d="M371 979V1007M1069 979V1007M371 1007H1069M720 1007V1022" fill="none" stroke="#768dab" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="290" y="1032" width="860" height="75" rx="15" fill="#2a2d36" stroke="#d9b575" stroke-width="2"/>
  <text x="320" y="1079" fill="#f1f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Report evidence + limits</text>
  <text x="731" y="1079" fill="#f0c788" font-family="Segoe UI,Arial,sans-serif" font-size="21">PASS · FAIL · NOT VERIFIED · BLOCKED</text>
  <text x="59" y="1150" fill="#a7bad0" font-family="Segoe UI,Arial,sans-serif" font-size="18">Interrupted? Reconcile saved state with current files before trusting any earlier status. PASS is advisory, not release authority.</text>
</svg>
