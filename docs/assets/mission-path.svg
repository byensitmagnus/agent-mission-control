<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Mission Control — from a goal to checked work</title>
  <desc id="desc">Workflow illustration. A lead chooses direct work or focused help. Both routes return to integration and verification. Actual routes depend on the task.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A8BBD4" stroke-opacity=".09"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#5BE0E5" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#11264B"/>
  <rect x="530" width="670" height="360" rx="16" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <path d="M48 45h17v17H48z" fill="none" stroke="#5BE0E5" stroke-width="2"/>
    <path d="m53 53 4 4 13-13" fill="none" stroke="#5BE0E5" stroke-width="2"/>
    <text x="82" y="60" font-size="18" letter-spacing="3" fill="#A8BBD4">AGENT MISSION CONTROL</text>
    <text x="46" y="143" font-size="58" font-weight="700" letter-spacing="-2" fill="#F4F8FD">A goal in.</text>
    <text x="46" y="210" font-size="58" font-weight="700" letter-spacing="-2" fill="#F4F8FD">Checked work out.</text>
    <text x="48" y="266" font-size="23" fill="#A8BBD4">One lead. The right help. Visible proof.</text>
    <path d="M48 307h48" stroke="#5BE0E5" stroke-width="3"/>
    <text x="110" y="313" font-size="16" letter-spacing="2" fill="#A8BBD4">PORTABLE WORKFLOW SKILL</text>
    <g fill="none" stroke="#5BE0E5" stroke-width="2" marker-end="url(#arrow)">
      <path d="M654 180h20q14 0 14-14v-61q0-14 14-14h22"/>
      <path d="M654 180h20q14 0 14 14v60q0 14 14 14h22"/>
      <path d="M935 91h20q14 0 14 14v61q0 14 14 14h20"/>
      <path d="M935 268h20q14 0 14-14v-60q0-14 14-14h20"/>
    </g>
    <rect x="555" y="143" width="100" height="74" rx="37" fill="#2C568C" stroke="#5BE0E5"/>
    <text x="605" y="189" text-anchor="middle" font-size="26" font-weight="600" fill="#F4F8FD">Lead</text>
    <rect x="729" y="54" width="205" height="74" rx="12" fill="#11264B" stroke="#A8BBD4" stroke-opacity=".7"/>
    <text x="831" y="100" text-anchor="middle" font-size="26" fill="#F4F8FD">Direct work</text>
    <text x="831" y="187" text-anchor="middle" font-size="17" fill="#A8BBD4" letter-spacing="2">OR</text>
    <rect x="729" y="231" width="205" height="74" rx="12" fill="#11264B" stroke="#A8BBD4" stroke-opacity=".7"/>
    <text x="831" y="277" text-anchor="middle" font-size="26" fill="#F4F8FD">Focused help</text>
    <rect x="1010" y="131" width="142" height="98" rx="12" fill="#11264B" stroke="#FFC46B" stroke-width="2"/>
    <text x="1081" y="171" text-anchor="middle" font-size="24" fill="#F4F8FD">Integrate</text>
    <text x="1081" y="205" text-anchor="middle" font-size="24" fill="#FFC46B">&amp; verify</text>
    <text x="841" y="337" text-anchor="middle" font-size="14" letter-spacing="1" fill="#A8BBD4">ILLUSTRATIVE ROUTES · CHOSEN FOR THE TASK</text>
  </g>
</svg>
