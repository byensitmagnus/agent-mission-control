name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate structural contracts
        run: python scripts/validate.py
      - name: Run validator negative controls
        run: python scripts/test_validate.py
      - name: Test disposable eval fixture preparation
        run: python scripts/test_prepare_eval.py
      - name: Check preservation diagnostic controls
        run: python evals/preservation_check.py --self-check
      - name: Test plugin packaging
        run: python scripts/test_package_plugin.py
      - name: Test project skill installation and preservation
        run: python scripts/test_install_skill.py
      - name: Check native usage accounting
        run: python scripts/test_usage_snapshot.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Check public real-task replays
        run: python evals/fps_replay.py --self-check
